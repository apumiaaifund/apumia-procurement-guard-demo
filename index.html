<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>АПУМИЯ Защита Закупок и Тендеров — Стенд РФ</title>
<style>body{margin:0;font-family:system-ui,sans-serif;background:#0b0f19;color:#f1f5f9}header{display:flex;justify-content:space-between;align-items:center;padding:16px 32px;border-bottom:1px solid #26324d;background:#0f1626}.brand{font-weight:800}.brand span{color:#38bdf8}.nav a{color:#38bdf8;text-decoration:none;margin-left:16px;font-size:14px}.wrap{max-width:920px;margin:32px auto;padding:0 20px}.card{background:#131b2e;border:1px solid #26324d;border-radius:16px;padding:26px}.badge{display:inline-block;background:rgba(56,189,248,.12);color:#38bdf8;border:1px solid rgba(56,189,248,.35);padding:4px 12px;border-radius:999px;font-size:12px;font-weight:700;margin-bottom:10px}textarea{width:100%;height:110px;background:#0b0f19;color:#e2e8f0;border:1px solid #334155;border-radius:10px;padding:12px;font-family:monospace;font-size:13px}button{margin-top:12px;background:#38bdf8;color:#0b0f19;border:none;padding:11px 22px;border-radius:10px;font-weight:700;cursor:pointer}.res{margin-top:16px;padding:16px;border-radius:10px;background:#0b0f19;border:1px solid #1e293b;font-family:monospace;font-size:13px;white-space:pre-wrap}.PASS{color:#4ade80;font-weight:800}.FAIL{color:#f87171;font-weight:800}</style></head>
<body><header><div class="brand">🛡️ АПУМИЯ Защита Закупок и Тендеров <span>Стенд проверки РФ</span></div><div class="nav"><a href="https://github.io">← Реестр решений</a></div></header>
<div class="wrap"><div class="card"><div class="badge">44-ФЗ / 223-ФЗ • Сметы и УПД • Decimal (0 float)</div><h1>АПУМИЯ Защита Закупок и Тендеров</h1><p style="color:#94a3b8">Детерминированная сверка счетов, УПД и спецификаций поставщиков со сметой контракта до оплаты.</p>
<textarea id="inp">{"позиция":"Кабель ВВГнг-LS 3х2.5","цена_счёт_руб":148.50,"цена_смета_макс_руб":135.00,"кол_во":500,"лимит_смета":500}</textarea><button onclick="run()">Выполнить проверку (AMES v2.0)</button><div class="res" id="out"></div></div></div>
<script>async function sha(m){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(m));return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,"0")).join("")}
async function run(){let o;try{o=JSON.parse(document.getElementById("inp").value)}catch(e){document.getElementById("out").innerHTML=`Статус: <span class="FAIL">ОТКЛОНЕНО</span>\nОшибка JSON: ${e.message}`;return}
const err=[];if(o["цена_счёт_руб"]>o["цена_смета_макс_руб"])err.push("ЗАВЫШЕНИЕ ЦЕНЫ ОТНОСИТЕЛЬНО СМЕТЫ");if(o["кол_во"]>o["лимит_смета"])err.push("ПРЕВЫШЕНИЕ ЛИМИТА ОБЪЁМА ПО СМЕТЕ");const h=await sha(JSON.stringify(o));
if(err.length===0){document.getElementById("out").innerHTML=`Статус: <span class="PASS">ПОДТВЕРЖДЕНО И ДОКАЗАНО</span>\nВсе нормативы РФ соблюдены.\nSHA-256: ${h}`}
else{document.getElementById("out").innerHTML=`Статус: <span class="FAIL">ЗАБЛОКИРОВАНО</span>\nПричины:\n - ${err.join("\n - ")}\nSHA-256: ${h}`}}run();</script></body></html>
